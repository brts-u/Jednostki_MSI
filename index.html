<!DOCTYPE html>
<html lang="pl">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0">
<title>MSI Warszawa — Odwiedzone dzielnice</title>

<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Fraunces:ital,opsz,wght@0,9..144,400;0,9..144,600;1,9..144,500&family=Inter:wght@400;500;600;700&family=IBM+Plex+Mono:wght@400;500&display=swap" rel="stylesheet">

<link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css" integrity="sha256-p4NxAoJBhIIN+hmNHrzRCf9tD/miZyoHS5obTRR9BMY=" crossorigin=""/>

<link rel="stylesheet" href="styles.css">
</head>
<body>

<header class="toolbar">
  <div class="toolbar-title">
    <h1>MSI Warszawa</h1>
    <p>Zaznacz dzielnice i osiedla, które już odwiedziłeś</p>
  </div>

  <div class="toolbar-search">
    <input list="neighborhood-list" id="searchInput" placeholder="Znajdź obszar…" autocomplete="off">
    <datalist id="neighborhood-list"></datalist>
  </div>

  <div class="toolbar-stamp" id="progressStamp" title="Postęp zwiedzania">
    <div class="stamp-ring">
      <span class="stamp-count" id="progressCount">0/0</span>
      <span class="stamp-label">ODWIEDZONE</span>
    </div>
  </div>

  <div class="toolbar-actions">
    <button id="exportBtn" class="btn-ghost" title="Zapisz listę odwiedzonych do pliku">Eksportuj</button>
    <button id="importBtn" class="btn-ghost" title="Wczytaj listę odwiedzonych z pliku">Importuj</button>
    <input type="file" id="importFile" accept="application/json" hidden>
    <button id="resetBtn" class="btn-ghost btn-danger" title="Wyczyść wszystkie zaznaczenia">Wyczyść</button>
  </div>
</header>

<main id="map"></main>

<div class="legend">
  <span class="legend-item"><i class="swatch swatch-unvisited"></i>Niezaznaczone</span>
  <span class="legend-item"><i class="swatch swatch-visited"></i>Odwiedzone</span>
</div>

<div class="toast" id="toast"></div>

<script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js" integrity="sha256-20nQCchB9co0qIjJZRGuk2/Z9VM+kNiyxNV1lvTlZBo=" crossorigin=""></script>
<script src="app.js"></script>
</body>
</html>
